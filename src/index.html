<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Overdub</title>
<style>
  :root {
    --ink: #15110c; --surface: #1f1a13; --surface-2: #2a2319; --border: #3a3123;
    --text: #ece6da; --text-muted: #a89d89; --accent: #d9a54a; --danger: #d9634a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ink); color: var(--text);
    font: 14px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif;
    padding: 24px;
  }
  h1 { font-size: 18px; margin: 0 0 4px; letter-spacing: .01em; }
  .subtitle { color: var(--text-muted); font-size: 12.5px; margin-bottom: 22px; }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .section-title { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-muted); margin-bottom: 10px; }

  button { font: inherit; cursor: pointer; border-radius: 7px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); padding: 8px 14px; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #241a08; border-color: var(--accent); font-weight: 600; }
  button.primary.danger { background: var(--danger); border-color: var(--danger); color: #2a0e08; }
  button:disabled { opacity: .5; cursor: default; }
  button.chip { padding: 5px 10px; font-size: 12.5px; margin-right: 6px; }
  button.chip.active { background: var(--accent); color: #241a08; border-color: var(--accent); }
  button.chip.danger:hover { border-color: var(--danger); }

  select { font: inherit; background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 7px; padding: 7px 10px; margin-right: 10px; }

  #transport { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .status { color: var(--text-muted); font-size: 13px; }
  .status.recording { color: var(--danger); font-weight: 600; }

  #layers { display: flex; flex-direction: column; gap: 10px; }
  .layer-row { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; background: var(--surface-2); }
  .layer-row.muted { opacity: .55; }
  .layer-row.soloed { border-color: var(--accent); }
  .layer-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
  .layer-name { font-size: 13px; font-weight: 600; }
  canvas.waveform { display: block; width: 100%; height: 48px; background: var(--ink); border-radius: 5px; margin-bottom: 8px; }
  .layer-controls { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .vol-label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); margin-right: 8px; }
  .empty-note { color: var(--text-muted); font-size: 13px; padding: 8px 0; }

  .repeat-label { display: inline-flex; align-items: center; gap: 6px; margin-right: 14px; font-size: 13px; }
  .repeat-input { width: 56px; font: inherit; background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; }
  #export-status { color: var(--text-muted); font-size: 12.5px; margin-top: 10px; }

  #recorder[hidden] { display: none; }
  #mic-status { color: var(--text-muted); font-size: 12.5px; margin-top: 8px; }
</style>
</head>
<body>
  <h1>Overdub</h1>
  <div class="subtitle">Record a phrase, loop it, layer more takes on top, trim an intro/outro, export.</div>

  <div class="panel" id="mic-panel">
    <div class="section-title">Microphone</div>
    <button id="mic-btn" class="primary">Enable Microphone</button>
    <div id="mic-status"></div>
  </div>

  <div id="recorder" hidden>
    <div class="panel">
      <div class="section-title">Record</div>
      <div id="transport"></div>
    </div>

    <div class="panel">
      <div class="section-title">Layers</div>
      <div id="layers"></div>
    </div>

    <div class="panel">
      <div id="export-panel"></div>
      <div id="export-status"></div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
